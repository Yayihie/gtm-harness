[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtmharness"
version = "0.6.0"
description = "CI/CD discipline for GTM pipelines: declared-as-code workflows with contract tests, dry-run diffs, and audit logs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.scripts]
gtmharness = "gtmharness.cli:main"

[project.optional-dependencies]
hubspot = ["hubspot-api-python>=11.0"]
salesforce = ["simple-salesforce>=1.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
